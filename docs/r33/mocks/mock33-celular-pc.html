<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#121c2a;--btn:#1a2638;--edge:#34455e;--ink:#e9e2d0;--mute:#93a3b8;--gold:#f0c060;--red:#e04848;--pix:'Silkscreen',monospace}
*{box-sizing:border-box}
body{margin:0;width:1366px;height:768px;overflow:hidden;position:relative;background:#000;font-family:'Barlow Semi Condensed',sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;width:1366px;height:768px}
canvas{image-rendering:pixelated;display:block}
.dim{position:absolute;left:0;right:0;top:58px;height:620px;background:#050a12c8}
.dock{position:absolute;left:370px;top:678px;right:0;bottom:0;background:var(--bg)}
.btn{position:absolute;top:686px;width:82px;height:74px;background:var(--btn);border:2px solid var(--edge);border-radius:3px}
.btn .k{position:absolute;left:5px;top:3px;font-family:var(--pix);font-size:9px;color:#93a3b8}
.btn .lb{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-family:var(--pix);font-size:10px;font-weight:700;letter-spacing:.12em;color:#cbc6b7}
.btn.on{border-color:var(--gold);background:#2a2a24}
.btn.on .lb{color:var(--gold)}
.btn .bang{position:absolute;right:-6px;top:-8px;background:var(--red);color:#fff;font-family:var(--pix);font-size:10px;padding:2px 5px;border:2px solid #1a1018}
.sep{position:absolute;top:688px;width:2px;height:70px;background:#2a3a52}
.bolso{position:absolute;top:716px;font-family:var(--pix);font-size:10px;letter-spacing:.3em;color:#93a3b8}
.fixar{position:absolute;top:704px;height:38px;padding:0 10px;border:1px dashed #4a5d78;border-radius:3px;color:#cbd5e1;font-size:15px;line-height:36px}
.ann{position:absolute;border:2px dashed #7fd0ff;border-radius:4px}
.callout{position:absolute;background:#0d2236f2;border:2px dashed #7fd0ff;color:#dff3ff;font-size:14px;padding:6px 9px;border-radius:4px;line-height:1.25}
.callout b{color:#fff}
.note{position:absolute;background:#16263af4;border:1px solid #3a5070;border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.3}
.note h4{margin:0 0 6px;font-family:var(--pix);font-size:11px;letter-spacing:.12em;color:var(--gold)}
.note .it{border-left:3px solid var(--gold);padding:4px 8px;margin:5px 0;background:#0f1d2c}
.note .it b{color:var(--gold)}
.note .sm{color:var(--mute);font-size:13px}
.eras{display:flex;gap:6px;margin-top:6px}
.eras div{flex:1;text-align:center;font-size:12px;color:var(--mute);background:#0f1d2c;border:1px solid #2b4260;border-radius:4px;padding:4px 2px}
.eras div b{display:block;color:var(--ink);font-size:12.5px}
.eras canvas{margin:0 auto 3px}
.title{position:absolute;left:18px;top:64px;background:#0b141ef0;padding:6px 10px;border-radius:4px;border:1px solid #2b4260;font-family:var(--pix);font-size:13px;color:var(--gold);letter-spacing:.12em;z-index:3}
.title span{color:var(--mute);font-family:'Barlow Semi Condensed';letter-spacing:0;font-size:15px}
/* phone screen */
.scr{position:absolute;overflow:hidden;font-size:13px}
.sbar{display:flex;justify-content:space-between;font-family:var(--pix);font-size:9px;color:#e9f0ff;padding:3px 8px;background:#0008}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 4px;padding:10px 8px}
.app{text-align:center;font-size:12px;color:#f2f4f8;position:relative;text-shadow:1px 1px 0 #000}
.app canvas{margin:0 auto 2px}
.app i{position:absolute;right:12px;top:-4px;background:var(--red);color:#fff;font-style:normal;font-family:var(--pix);font-size:8px;padding:1px 4px;border:1px solid #1a1018}
.notif{margin:6px 8px 0;background:#f4efe2;color:#2a2018;border-radius:5px;padding:5px 7px;font-size:12.5px;line-height:1.2;border:2px solid #1a1018}
.notif b{color:#b0441e}
.apphead{background:#2a1f3d;color:#fff;padding:6px 8px;font-weight:700;font-size:14px;border-bottom:2px solid #1a1018;display:flex;justify-content:space-between;align-items:center}
.apphead span{font-weight:400;font-size:11.5px;color:#cdb9f5}
.opt{margin:5px 7px;background:#fffaf0;color:#2a2018;border:2px solid #1a1018;border-radius:4px;padding:5px 7px;font-size:12.5px;line-height:1.2;box-shadow:2px 2px 0 #00000055}
.opt b{display:block;font-size:13.5px}
.opt em{font-style:normal;color:#2f7a3a;font-weight:600}
.opt em.r{color:#b0441e}
.opt.sel{outline:3px solid var(--gold)}
.feed{margin:6px 7px;background:#1d1530;border:1px solid #4a3a6a;border-radius:4px;padding:5px 7px;color:#e6dcff;font-size:12px}
/* pc */
.desk{display:grid;grid-template-columns:repeat(2,96px);gap:12px 8px;padding:12px;position:absolute;left:0;top:0;bottom:30px}
.ico{text-align:center;font-size:12.5px;color:#fff;text-shadow:1px 1px 0 #000;position:relative}
.ico canvas{margin:0 auto 2px}
.ico i{position:absolute;right:18px;top:-4px;background:var(--red);color:#fff;font-style:normal;font-family:var(--pix);font-size:8px;padding:1px 4px;border:1px solid #1a1018}
.win{position:absolute;background:#f4f1ea;color:#1f2430;border:2px solid #1a1018;box-shadow:4px 4px 0 #0007}
.win .tb{background:#3b5b8a;color:#fff;font-weight:700;padding:4px 8px;font-size:13.5px;display:flex;justify-content:space-between}
.win .tb span{font-family:var(--pix);font-size:9px;line-height:16px}
.win .bd{padding:8px 10px;font-size:13px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #d8d2c4;padding:3px 0}
.row b{font-weight:700}
.bar{height:9px;background:#3b5b8a;border:1px solid #1a1018;display:inline-block;vertical-align:middle}
.wbtn{display:inline-block;background:#f0c060;border:2px solid #1a1018;padding:3px 8px;font-weight:700;margin:6px 4px 0 0;font-size:13px}
.wbtn.g{background:#dfe6ee}
.task{position:absolute;left:0;right:0;bottom:0;height:30px;background:#1b2430;border-top:2px solid #3a4a62;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12.5px;color:#cbd5e1}
.task .st{background:#2f7a3a;color:#fff;font-family:var(--pix);font-size:9px;padding:4px 7px;border:1px solid #1a1018}
.task .tab{background:#2a3a52;padding:3px 8px;border:1px solid #4a5d78}
.task .clk{margin-left:auto;font-family:var(--pix);font-size:9px}
.card{position:absolute;background:#16263af6;border:2px solid var(--gold);border-radius:6px;padding:9px 11px;width:250px;font-size:14px;box-shadow:0 8px 24px #000a}
.card h5{margin:0 0 2px;font-size:16px;color:#fff}
.card .s{color:var(--mute);font-size:12.5px;margin-bottom:6px}
.card .a{display:flex;justify-content:space-between;padding:4px 6px;border-top:1px solid #2b4260}
.card .a kbd{font-family:var(--pix);font-size:8px;background:#24364d;border:1px solid #4a6280;border-bottom-width:2px;border-radius:3px;padding:2px 4px;color:#fff}
.card .a.hi{background:#2a2a24;color:var(--gold);font-weight:700}
.ring{position:absolute;border:3px solid var(--gold);border-radius:4px;box-shadow:0 0 0 2px #1a1018,0 0 14px #f0c06099}

function eraPhone(kind,sc=2){return pcanvas(14,26,sc,(R)=>{
